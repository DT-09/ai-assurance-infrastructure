[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-assurance-sdk"
version = "0.2.0"
description = "Python SDK for the AI Assurance Control Plane"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["assurance_sdk*"]
