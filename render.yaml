services:
  - type: web
    name: ai-agent-trust-control-plane
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: ASSURANCE_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: ASSURANCE_DATABASE_URL
        sync: false
      - key: ASSURANCE_BOOTSTRAP_KEY
        sync: false
