services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aai
      POSTGRES_USER: aai
      POSTGRES_PASSWORD: change-me
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aai -d aai"]
      interval: 5s
      timeout: 5s
      retries: 10
  worker:
    build: .
    command: python -m app.worker
    environment:
      AAI_ENVIRONMENT: production
      AAI_DATABASE_URL: postgresql+psycopg://aai:change-me@postgres:5432/aai
      AAI_API_KEY: replace-me-with-a-random-key
      AAI_BOOTSTRAP_KEY: replace-me-with-a-random-bootstrap-key
      AAI_SIGNING_SECRET: replace-me-with-a-random-signing-secret
      AAI_KMS_PROVIDER: aws
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build: .
    environment:
      AAI_ENVIRONMENT: production
      AAI_DATABASE_URL: postgresql+psycopg://aai:change-me@postgres:5432/aai
      AAI_API_KEY: replace-me-with-a-random-key
      AAI_BOOTSTRAP_KEY: replace-me-with-a-random-bootstrap-key
      AAI_SIGNING_SECRET: replace-me-with-a-random-signing-secret
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
