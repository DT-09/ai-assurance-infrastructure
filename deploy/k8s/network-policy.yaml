apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: aai-default-deny}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: [{from: [{namespaceSelector: {matchLabels: {name: ai-assurance}}}]}]
  egress: [{to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}}]}, {to: [{podSelector: {matchLabels: {app: postgres}}}]}]
