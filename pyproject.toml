[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-assurance-infrastructure"
version = "4.0.0"
description = "Production AI assurance control plane, protocol and trust infrastructure."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2,<3",
  "python-multipart>=0.0.9,<1",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
]

[project.scripts]
aai = "cli.aai:main"

[tool.setuptools.packages.find]
include = ["app*", "cli*", "protocol*", "gateway*", "sdk*", "examples*"]

[project.urls]
Repository = "https://github.com/DT-09/ai-assurance-infrastructure"
Protocol = "/protocol"
